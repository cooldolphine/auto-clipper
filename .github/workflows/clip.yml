name: Auto clip pipeline
run-name: "Clip: ${{ inputs.urls || inputs.topics || 'config.json' }}"

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Video links (space or comma separated). Leave empty to search."
        required: false
        default: ""
      channels:
        description: "Channel links to search in (or 'none' to search all of YouTube)"
        required: false
        default: ""
      topics:
        description: "Topics to look for (comma separated)"
        required: false
        default: ""
      videos:
        description: "How many videos to clip"
        required: false
        default: "1"
      num:
        description: "Clips per video"
        required: false
        default: "5"
      length:
        description: "Clip length in seconds"
        required: false
        default: "40"
      language:
        description: "Speech language: hi, en or auto"
        required: false
        default: "hi"
      model:
        description: "Whisper model: tiny, base or small"
        required: false
        default: "small"
      framing:
        description: "Vertical framing: stack, blur, face or center"
        required: false
        default: "stack"
      captions:
        description: "Captions: karaoke, classic or off"
        required: false
        default: "karaoke"
      hook:
        description: "Headline in the first seconds: auto or off"
        required: false
        default: "auto"
      height:
        description: "Source video quality: 720, 1080 or 1440"
        required: false
        default: "1080"
      ai:
        description: "AI moment picking and virality scores: on or off"
        required: false
        default: "on"
      broll:
        description: "Stock footage cutaways: off or auto"
        required: false
        default: "off"
      transitions:
        description: "Transition style: off, fade, flash, slide, wipe, zoom, circle or mix"
        required: false
        default: "off"

permissions:
  contents: write
  statuses: write   # live progress for the phone app   # save processed.json and publish clips as a release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2   # JS runtime yt-dlp needs for YouTube
        with:
          deno-version: v2.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Write cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then echo "$YT_COOKIES" > cookies.txt; fi
      - name: Run clipper
        env:
          RUN_URLS: ${{ inputs.urls }}
          RUN_CHANNELS: ${{ inputs.channels }}
          RUN_TOPICS: ${{ inputs.topics }}
          RUN_VIDEOS: ${{ inputs.videos }}
          RUN_NUM: ${{ inputs.num }}
          RUN_LENGTH: ${{ inputs.length }}
          RUN_LANGUAGE: ${{ inputs.language }}
          RUN_MODEL: ${{ inputs.model }}
          RUN_FRAMING: ${{ inputs.framing }}
          RUN_CAPTIONS: ${{ inputs.captions }}
          RUN_HOOK: ${{ inputs.hook }}
          RUN_HEIGHT: ${{ inputs.height }}
          RUN_AI: ${{ inputs.ai }}
          RUN_BROLL: ${{ inputs.broll }}
          RUN_TRANSITIONS: ${{ inputs.transitions }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PERF_URL: ${{ vars.PERF_URL }}
        run: python -u pipeline.py
      - name: Save processed list
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f processed.json ]; then git add processed.json; fi
          git diff --cached --quiet || (git commit -m "update processed videos" && git push)
      - name: Publish clips to a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls release/*.mp4 >/dev/null 2>&1; then
            gh release create "run-${{ github.run_number }}" release/* \
              --title "Run ${{ github.run_number }}" --notes-file release/index.json
          fi
          # keep only the 10 newest releases
          gh release list --limit 100 --json tagName -q '.[10:][].tagName' \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes || true
      - uses: actions/upload-artifact@v4   # backup copy in case the release step fails
        if: always()
        with:
          name: clips-${{ github.run_number }}
          path: release/*
          retention-days: 3
          if-no-files-found: ignore
